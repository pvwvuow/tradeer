# Proposed .github/workflows/ci.yml, version 2 (8 October 2026): copy it over the old one by
# hand, the bot's GitHub token may not change workflows. See scripts/ci/workflows/README.md.
name: CI

# Pull requests only: main gets commits only through PRs whose checks passed (branch
# protection), so a second run on every push to main would test the same code again.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  # Seconds on Linux. Decides whether the heavy jobs run at all. A skipped job counts as
  # passed for a required check, so docs-only PRs and release-please PRs merge in a minute.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A release PR only adds the version and the CHANGELOG to code its own PR tested.
          case "$HEAD_REF" in release-please--*) echo "code=false" >> "$GITHUB_OUTPUT"; exit 0;; esac
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|LICENSE$|[^/]*\.md$|\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint and type-check moved here from Windows: about 1 minute instead of 3. mypy checks the
  # Windows code paths with --platform win32.
  test:
    name: Tests (Linux, Qt offscreen)
    needs: changes
    # Runs also when "changes" itself failed (empty output), so a broken filter never skips tests.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt system libs
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install project
        run: uv pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --diff .
      - name: Mypy
        run: mypy --platform win32
      - name: Pytest (parallel)
        run: pytest

  # Tests only (lint ran on Linux), in parallel workers, no reinstall of pip.
  ci:
    name: ci
    needs: changes
    # Runs also when "changes" itself failed (empty output), so a broken filter never skips tests.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install project
        run: uv pip install -e ".[dev]"
      - name: Test with coverage
        shell: pwsh
        run: ./scripts/ci/check.ps1 -SkipInstall -SkipLint
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_number }}
          path: coverage.xml
          if-no-files-found: ignore

  # In parallel with ci (it used to wait for ci): about 8 minutes sooner on every PR.
  build:
    name: build
    needs: changes
    # Runs also when "changes" itself failed (empty output), so a broken filter never skips tests.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install project
        run: uv pip install -e ".[dev]"
      - name: Build with PyInstaller and run --self-check
        shell: pwsh
        run: ./scripts/ci/build.ps1 -SkipInstall
      - name: Upload the portable build
        uses: actions/upload-artifact@v7
        with:
          name: MT5TradingWorkstation-${{ github.run_number }}
          path: dist/MT5TradingWorkstation-portable.zip
          if-no-files-found: error
          retention-days: 7
