# Proposed .github/workflows/ci.yml (6 October 2026): copy it over the old one by hand, the
# bot's GitHub token may not change workflows. See scripts/ci/workflows/README.md.
name: CI

# Pull requests only: main gets commits only through PRs whose checks passed (branch
# protection), so the old second run on every push to main tested the same code again.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A release-please PR only adds the version and the CHANGELOG to code its own PR tested, so
# its three jobs are skipped; a skipped job counts as passed for a required check. The
# publish job still builds and self-checks the release.
jobs:
  test:
    name: Tests (Linux, Qt offscreen)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  ci:
    name: ci
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Lint, type-check and test
        shell: pwsh
        run: ./scripts/ci/check.ps1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_number }}
          path: coverage.xml
          if-no-files-found: ignore

  # In parallel with ci now (it waited for ci before): about 7 minutes sooner on every PR.
  build:
    name: build
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build with PyInstaller and run --self-check
        shell: pwsh
        run: ./scripts/ci/build.ps1
      - name: Upload the portable build
        uses: actions/upload-artifact@v7
        with:
          name: MT5TradingWorkstation-${{ github.run_number }}
          path: dist/MT5TradingWorkstation-portable.zip
          if-no-files-found: error
