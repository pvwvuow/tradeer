[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-trading-workstation"
version = "0.1.0"
description = "Safety-first MetaTrader 5 trading workstation for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary. All rights reserved." }
# Exact pins for direct dependencies. Each later phase adds its own pinned libraries
# (loguru, keyring, httpx, psutil, pandas, pyqtgraph, lightgbm, scikit-learn, shap, supabase).
dependencies = [
  "MetaTrader5==5.0.6090; sys_platform == 'win32'",
  "numpy==2.2.6",
  "pydantic==2.11.7",
  "PySide6==6.10.3",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pre-commit==4.2.0",
  "pyinstaller==6.22.3",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "pytest-qt==4.5.0",
  "ruff==0.16.9",
]

[project.scripts]
mt5-workstation = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
qt_api = "pyside6"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
