[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-trading-workstation"
version = "0.1.0"
description = "Safety-first MetaTrader 5 trading workstation"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = {text = "All rights reserved"}
dependencies = [
  "MetaTrader5==5.0.6180; platform_system == 'Windows'",
  "numpy==2.3.3",
  "pandas==2.3.3",
  "PySide6==6.10.3",
  "pydantic==2.12.5",
  "pydantic-settings==2.11.0",
  "httpx==0.28.1",
  "keyring==25.6.0",
  "loguru==0.7.3",
  "psutil==7.1.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pre-commit==4.3.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "pytest-qt==4.5.0",
  "ruff==0.14.0",
  "pyinstaller==6.22.3",
]

[project.scripts]
mt5-workstation = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
