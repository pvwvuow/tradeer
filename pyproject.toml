[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-trading-workstation"
version = "0.23.1"
description = "Safety-first MetaTrader 5 trading workstation for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary. All rights reserved." }
# Exact pins for direct dependencies. Each later phase adds its own pinned libraries.
# Phase 11 adds only lightgbm (it brings numpy and scipy): calibration, metrics and SHAP
# values need no scikit-learn, shap or joblib (ADR 97). In-app updates use velopack (ADR 113).
dependencies = [
  "httpx==0.28.1",
  "keyring==25.7.0",
  "lightgbm==4.6.0",
  "loguru==0.7.3",
  "MetaTrader5==5.0.6090; sys_platform == 'win32'",
  "numpy==2.4.6",
  "pydantic==2.11.7",
  "pyqtgraph==0.14.0",
  "PySide6==6.10.3",
  "velopack==1.2.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pre-commit==4.2.0",
  "pyinstaller==6.22.3",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-qt==4.5.0",
  "ruff==0.16.9",
]

[project.scripts]
mt5-workstation = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.calendar" = ["mql5/*.mq5"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
# MetaTrader5 and pyqtgraph ship no type information; keyring is imported lazily on first use.
module = ["MetaTrader5", "keyring", "keyring.*", "pyqtgraph", "pyqtgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lightgbm is imported lazily (app/ml/model.py) and used as Any.
module = ["lightgbm", "lightgbm.*", "scipy", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# velopack is imported lazily (app/updates) and used as Any.
module = ["velopack", "velopack.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
qt_api = "pyside6"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
