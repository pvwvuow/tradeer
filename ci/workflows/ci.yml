# Staged copy: move this file to .github/workflows/ci.yml (see README "Turn on CI").
name: ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Lint, type-check and test
        shell: pwsh
        run: ./scripts/ci/check.ps1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.run_number }}
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: build
    needs: ci
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build with PyInstaller and run --self-check
        shell: pwsh
        run: ./scripts/ci/build.ps1
      - name: Upload the portable build
        uses: actions/upload-artifact@v6
        with:
          name: MT5TradingWorkstation-${{ github.run_number }}
          path: dist/MT5TradingWorkstation-portable.zip
          if-no-files-found: error
